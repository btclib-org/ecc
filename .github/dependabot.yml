---
# every ecosystem this repository has but one: the pre-commit hook
# revisions are left out. Dependabot has a pre-commit ecosystem, and the
# maintainer decided to keep pre-commit.ci for them instead
# (btclib-org/.github#1391): its weekly autoupdate, configured in the ci:
# block of .pre-commit-config.yaml, already rewrites rev: for every repo:
# but local and meta, so a second bot on the same pin would only compete
# with it. A hook whose repo: is local is one autoupdate does not reach:
# typos moves by a hand edit of its additional_dependencies, and pyroma
# by the uv ecosystem below, uv.lock being where its version is pinned.
#
# every pull request here runs the whole merge gate, so each ecosystem
# groups its updates into a single pull request rather than paying for
# that once each. None declares a target-branch: without one dependabot
# opens against the default branch, which is the only branch a change
# lands on -- and a target-branch naming a branch that is not there is
# not an error anywhere, it is a repository where nothing is proposed.
#
# Weekly: the deps-latest workflow upgrades everything uv resolves and
# runs the suite, the lint gate and the packaging checks against it, on a
# schedule, off the critical path, so each pull request is a diff whose
# result is already known. The github-actions ecosystem gets the same
# interval for symmetry rather than for evidence: nothing pre-validates an
# action bump, and a week where no action moved produces no pull request.
#
# The seven day cooldown is what the interval trades against: a
# compromised release is usually yanked within days, so nothing but
# btclib-org/.github's tags, excluded in the github-actions block, is offered
# before it has been public a week, wherever the release can be dated: the
# docker block says where it cannot
version: 2
updates:
  # every action is pinned to a commit SHA, which nothing but this
  # moves: without it a pin is frozen, and a fix (or a security advisory)
  # upstream would never reach this repository
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # thursday, where deps-latest runs wednesday: the sentinel has just
      # reported when the pull requests are opened, and it is the day
      # section 10 of the organization's standard gives every repository
      day: thursday
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
      # the exclude section 11 of btclib-org/.github's README.md gives for
      # that repository's own tags, which the calls in .github/workflows pin
      exclude: ["btclib-org/.github/*"]

  # uv.lock is committed and the workflows install from it with --locked, bar
  # the exceptions CONTRIBUTING.md lists, while the dependency groups declare a
  # floor, and a ceiling only on uv_build, copied from [build-system]: the
  # drift of the bindings and the tooling above those floors lives in the lock
  # file, and this moves it, bar the one exception section 1 of
  # btclib-org/.github's README names. The uv-lock pre-commit hook re-locks
  # what pyproject.toml changed and upgrades nothing, and deps-latest tests an
  # upgrade it never commits
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: thursday
    groups:
      dev-tooling:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # .clusterfuzzlite/Dockerfile pins the image fuzz.yml builds in by
  # digest, which nothing but this moves: without it the pin is frozen at
  # the image of the day it was written. The cooldown is inert here:
  # dependabot-core dates a docker tag only on Docker Hub
  # (registry_tag_release_date, docker/lib/dependabot/docker/
  # update_checker.rb) and this image is on gcr.io. It is kept so that one
  # rule holds for every ecosystem, and it takes effect with no edit here
  # where the registry or dependabot-core changes
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: thursday
    groups:
      base-image:
        patterns: ["*"]
    cooldown:
      default-days: 7
