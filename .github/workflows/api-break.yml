---
name: api-break

# Labels a pull request `api-break` when it breaks the public API: the griffe
# walk of `reusable-public-api.yml`, run against the pull request's base commit
# (btclib-org/.github#1674). The walk, the label and the removal of it on a
# later push that finds no break are `btclib-org/.github`'s
# `reusable-api-break.yml`, called at a tagged commit (section 10 of
# btclib-org/.github's README.md). What stays here is the trigger, the
# concurrency group, the permissions and the package.
#
# Not a required check, and it must not become one: before 1.0 a package
# breaks its surface deliberately, and the label tells a reviewer, who
# decides. `release.yml`'s `public-api` job is where the release is asked
# the same question.
#
# `pull_request` and not `pull_request_target`, which the organization
# declines: a fork's pull request is not labelled, its token being
# read-only, and its run writes the finding to the run's summary.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the walk the
    # callee's draft condition withheld. closed too: the group below is at
    # the workflow level, so a closed run enters it when the run is
    # created: a close cancels a walk nobody is going to read, a merge
    # queues behind it. The callee's own job-level `if:` declines the walk
    # itself
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN at the workflow level, elevated on
# the calling job below
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here, and by the pull request's number, so that a push supersedes the
# walk it overtakes. There is no push trigger, so the walk in flight is
# the only reading a merged pull request gets
concurrency:
  group: api-break-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  api-break:
    # a caller's permissions: block bounds the called workflow and refuses
    # rather than trims, so every scope the callee's job asks for is named
    # here (btclib-org/.github#912)
    permissions:
      contents: read
      pull-requests: write # the label; read-only on a fork
    uses: btclib-org/.github/.github/workflows/reusable-api-break.yml@eb3b0c28476b98694ab3a3c3a9dce7e8e26ab4f5 # v2026.10.26
    with:
      package: ecc
