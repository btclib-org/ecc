---
name: deps-oldest

# the mirror of deps-latest.yml: the claim a floor makes to whoever
# installs this package, verified. `uv lock --resolution lowest-direct`
# takes every direct dependency to the floor pyproject.toml declares --
# the libsecp256k1 bindings' first -- on the oldest interpreter
# requires-python admits, and runs the suite against it. Not `lowest`,
# which takes transitive dependencies to their minima too and resolves
# environments that do not install. What it finds is an issue against the
# floor.
#
# The resolution and the suite are btclib-org/.github's
# reusable-deps-oldest.yml, called at a tagged commit (section 10 of
# btclib-org/.github's README.md). What stays here is the interpreter and
# `pre-suite-script`, this tree's own assertion that the bindings still serve at
# that floor: `.github/scripts/assert_bindings_serving.py` has the reason it is
# a step of its own rather than folded into pytest

on:
  schedule:
    # section 10's calendar in btclib-org/.github, and not this file's to
    # restate
    - cron: "48 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-oldest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-oldest:
    uses: btclib-org/.github/.github/workflows/reusable-deps-oldest.yml@eb3b0c28476b98694ab3a3c3a9dce7e8e26ab4f5 # v2026.10.26
    with:
      # the requires-python floor: the version is a claim this tree makes,
      # so it is passed rather than read off .python-version, which names
      # the ceiling
      python-version: "3.11"
      pre-suite-script: .github/scripts/assert_bindings_serving.py
