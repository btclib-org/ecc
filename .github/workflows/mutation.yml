---
name: mutation

# Coverage answers "was this line executed"; this answers "would the suite
# notice if it were wrong", and a surviving mutant names one line at a
# time where it would not.
#
# The baseline check, the session loop, the restore guard, the counts and the
# upload are btclib-org/.github's reusable-mutation.yml, called at a tagged
# commit (section 10 of btclib-org/.github's README.md). What stays here is this
# tree's own subject matter -- the profiles below, their budgets and their
# ceilings -- and the trigger, the schedule, the dispatch dropdown, the
# concurrency group and the permissions.
#
# It gates nothing, by design: a mutant survives because a test is
# missing, so a red merge would block whoever next touched the file for a
# hole somebody else left. It does not appear in main's required checks.
#
# What runs here is what .github/mutation/*.toml says: one list of scopes
# and test commands, not a second copy of them in yaml.

on:
  # No pull_request trigger: a session is hours, and a trigger on
  # .github/mutation/*.toml would hang that off a pull request it is not
  # allowed to gate. check-toml parses these files on every commit, and
  # `cosmic-ray baseline`, which the callee runs first, fails the run
  # before any mutant if a test command has gone stale
  schedule:
    # section 10's calendar in btclib-org/.github, and not this file's to
    # restate. Only the default branch schedules workflows, so on any
    # other branch this is reachable through the dispatch below
    - cron: "48 5 * * 1"
  # the way to ask one scope's numbers without spending the whole matrix
  workflow_dispatch:
    inputs:
      profile:
        # `all` is what the schedule does. Spelled rather than left empty:
        # a blank entry in a dropdown reads as a mistake
        description: one profile's slug, or all of them
        required: false
        default: all
        type: choice
        options:
          - all
          - signatures
          - curves
          - boundaries
          - frost
          - kdf

# least privilege for the GITHUB_TOKEN: nothing here writes. No issues:
# write either -- a survivor is a test to write rather than a defect to
# track
permissions:
  contents: read

# cancel-in-progress because a dispatch is how somebody asks for these
# numbers now, and waiting behind the scheduled run for hours would
# defeat it
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: btclib-org/.github/.github/workflows/reusable-mutation.yml@ed616d71c43cd4c8bded40d1182befccd99e6ee7 # v2026.10.29
    with:
      # One object per profile, every value this tree's own: the phrase
      # the job is named for, the slug the dropdown and the artifact are
      # keyed on, the ceiling in minutes, and the sessions in the order
      # they run. The callee's `profiles` input describes that shape.
      #
      # Every budget below is the one btclib-org/btclib's `mutation.yml`
      # gives the same modules:
      #
      # `signatures` and `curves`: ninety minutes each, a sample rather
      # than a finished session -- the weekly job cuts the session there
      # and reports what it judged, and the verdicts in a sample of the
      # same slice are stable, so one that changes is a test that stopped
      # checking what it used to.
      #
      # `boundaries`: musig2.toml, the ceiling its budget plus the
      # environment.
      #
      # `frost`: a runner of its own rather than a second session in
      # `boundaries`: btclib's dispatch of this profile spent the whole
      # sixty minutes and left most of its scope unrun.
      #
      # `kdf`: the twenty-five minutes btclib gives a scope holding these
      # two modules and two more, at the thirty-second per-mutant timeout
      # kdf.toml argues
      profiles: >-
        [{"profile": "signature signing and verification", "slug": "signatures", "ceiling": 100,
        "sessions": "signatures.toml 90m"},
        {"profile": "the pure-Python curve arithmetic", "slug": "curves", "ceiling": 100,
        "sessions": "curve_group.toml 90m"},
        {"profile": "musig2 signing", "slug": "boundaries", "ceiling": 30, "sessions":
        "musig2.toml 20m"},
        {"profile": "FROST threshold signing", "slug": "frost", "ceiling": 75, "sessions":
        "frost.toml 60m"},
        {"profile": "key agreement and derivation", "slug": "kdf", "ceiling": 35, "sessions":
        "kdf.toml 25m"}]
      # the dropdown above, forwarded. A schedule has no `inputs`, so this
      # arrives at the callee as an empty string, which its own `SELECTED`
      # expression reads as every profile
      selected: ${{ inputs.profile }}
