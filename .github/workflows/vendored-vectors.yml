---
name: vendored vectors

# tests/_data/README.md pins every vendored test vector to a commit and
# a git blob SHA-1, and carries a documented manual procedure to
# re-check one pin. This runs that procedure once a week instead, over
# every pin the script can check, and opens or updates an issue on
# drift rather than fixing anything: what to do about a pin that has
# moved is a decision the script does not get to make.
# It also hashes each vendored file and compares the blob with the
# ledger's and with upstream's at the pinned commit; a mismatch fails
# the run.
#
# The checkout, the optional interpreter setup and the re-check itself are
# btclib-org/.github's: reusable-vendored-vectors.yml, called at a tagged commit
# (section 10 of btclib-org/.github's README.md). What stays here is the
# trigger, the cron minute, the concurrency group and the ledger this tree
# checks.
#
# Why this workflow takes issues: write is the called workflow's own
# header, not this file's to restate.

on:
  schedule:
    # section 10's calendar in btclib-org/.github, and not this file's to
    # restate. Only the default branch schedules workflows, so on any
    # other branch this is reachable through the dispatch below, and
    # through the pull_request trigger further down
    - cron: "48 3 * * 1"
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition withheld; closed, so that the landing falls in this
    # pull request's own concurrency group and supersedes a run it is
    # still holding, the called job declining the real work on it
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/vendored-vectors.yml
      - .github/scripts/check_vendored_vectors.py
      - tests/_data/README.md

permissions:
  contents: read

# github.event.pull_request.number rather than github.head_ref: it is set
# only for pull_request events, so a scheduled or dispatched run keeps a
# group of its own, a closed event lands in its pull request's group
# rather than the base branch's, and two forks whose head branches share
# a name do not share a group
concurrency:
  group: vendored-vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  vectors:
    uses: btclib-org/.github/.github/workflows/reusable-vendored-vectors.yml@0f5684ab3d7bf310b0d7a2e4dd91a03522f75d67 # v2026.10.25
    # permissions do not inherit through a call: the called job wants
    # issues: write for its gh issue create/edit/close calls, so the
    # calling job declares it here, which is what caps what the called
    # workflow may be granted
    permissions:
      contents: read
      issues: write # gh issue create/edit/close, in the called workflow
    with:
      # cardinality 1: this tree pins one ledger, tests/_data/README.md
      ledgers: >-
        [{"ledger": "tests/_data/README.md",
        "title": "Vendored vectors behind upstream"}]
      # the interpreter .python-version pins: the script imports only the
      # standard library, so this is this tree's choice to pin one rather
      # than run against the runner's own python3
      python-version: "3.15"
