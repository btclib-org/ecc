---
name: test

# the suite under coverage, and the distribution files built, checked and
# installed, the sdist running its own suite: the two questions a pull
# request is gated on besides the hooks and the documentation build,
# which lint.yml and docs.yml ask.
# release.yml calls this workflow, and its `dist` job then checks the files
# reusable-build.yml built and signed instead of building its own

on:
  push:
    # main only: a push to a branch with an open pull request would run
    # this workflow twice, once per event, in two concurrency groups that
    # do not cancel each other. main keeps a trigger of its own because a
    # merge creates a commit the pull request never tested. Tag pushes are
    # the release workflow's
    branches: [main]
    # a documentation-only commit would otherwise run every job below.
    # Only on push: "test: every job passed" is a required check, and on
    # pull_request a filter would produce no run at all, which blocks the
    # merge instead of passing it. The changes job below is the
    # pull_request side of the same question
    paths-ignore:
      - "*.md"
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld; closed, so that the landing falls in
    # this pull request's own concurrency group and cancels the run it
    # supersedes, every job declining the real work on it
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the release workflow reuses the whole pipeline
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
      use-signed-dist:
        description: >
          Whether the `dist` job checks the files the caller's build job
          uploaded, instead of building and uploading its own. Only
          release.yml's call sets this: the files it publishes are the
          ones reusable-build.yml signed, and a second upload of `dist`
          or `sbom` in the same run would collide with that job's.
        type: boolean
        default: false
      digests:
        description: >
          The `digests` output of reusable-build.yml, which the `dist`
          job checks the downloaded files against when `use-signed-dist`
          is set, so that what it verified is what release.yml publishes.
          Ignored otherwise.
        type: string
        default: ""
  # the gate on demand, for a branch whose pull request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must
# not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch or pull request. Named
# literally rather than with github.workflow, which in a called workflow
# is the caller's name. A pull_request run groups by the pull request's
# own number, which no push's github.ref can equal, so a closed run never
# lands in main's push group. The suffix keeps a release run out of the
# branch groups: inside a called workflow github.ref is the caller's, so a
# rehearsal dispatched on a branch would otherwise compute the group a
# push to that branch computes, and one would cancel the other
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the cheapest job in the workflow, and the one that decides whether the rest
  # of it runs: a pull request that edits only prose changes nothing the jobs
  # below read. The event handling and the decision are btclib-org/.github's,
  # called at a tagged commit (section 10 of btclib-org/.github's README.md);
  # what stays here is which files are this tree's own prose
  changes:
    name: Decide whether the jobs below have anything to check
    uses: btclib-org/.github/.github/workflows/reusable-changes.yml@ed616d71c43cd4c8bded40d1182befccd99e6ee7 # v2026.10.29
    # a job's permissions replace the workflow's rather than adding to
    # them, so contents: read is named beside the scope the callee's job
    # adds: a block leaving it off would bound the call to contents: none
    permissions:
      contents: read
      pull-requests: read # the callee's own job needs it to list a pull request's files
    with:
      # every root prose file but README.md, .github's own markdown and the
      # detect-secrets baseline -- nothing these jobs read. README.md stays
      # off the list, being the long description the dist job's twine and
      # pyroma steps check. No workflow is on it either: leaving every
      # workflow edit to run everything is the cheap direction to be wrong
      # in. A literal block scalar, the pattern having no space in it,
      # which keeps yamllint's width rule off the line
      prose-pattern: |-
        ^(AUTHORS|CHANGELOG|AGENTS|CONTRIBUTING|RELEASE_NOTES|RELEASING|REPOSITORY|REVIEWING|SECURITY)\.md$|^\.github/[^/]*\.md$|^\.secrets\..*baseline$

  coverage:
    name: Measure coverage, gated at 100%
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag is a name its owner can move, and these run in a job that can
      # read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it. No job in these
          # workflows performs an authenticated git operation, so nothing
          # needs it to stay
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # the cache holds the wheels uv.lock resolves, which every run
          # otherwise fetches again
          enable-cache: true
          # what .python-version pins and what a bare `uv run` gives a
          # maintainer locally: the number this job gates on is a ratio of
          # statements, and the statement count moves between interpreters.
          # Pinned here even so, because the coupling belongs where the gate
          # runs
          python-version: "3.15"
      # neither --cov nor its report format is repeated here: addopts
      # carries --cov, and [tool.coverage.report] the report, so the bare
      # pytest below is what a contributor runs
      - name: Run pytest under coverage
        run: uv run --locked --no-default-groups --group test pytest
        env:
          # not the default `.coverage`: `coverage-union` downloads this
          # artifact beside the `no-bindings` job's, and two files named
          # alike would overwrite each other there. `COVERAGE_FILE` is
          # coverage's own variable for `--data-file`, so the command
          # above stays the one a contributor runs
          COVERAGE_FILE: coverage-data-bindings
      # the run above gates at 100% on its own; the data is uploaded as
      # well because a percentage cannot be combined with another job's,
      # and `coverage-union` below needs the lines
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-bindings
          path: coverage-data-bindings
          # no data file means pytest never ran, which the default would
          # hide behind a warning
          if-no-files-found: error

  # the package installed without btclib-secp256k1, answering on its own
  # Python arithmetic. The suite reaches those arms locally by clearing
  # the dispatch seam, which is not the same configuration: an unguarded
  # import of the bindings would fail before any seam could be cleared,
  # and every arm gated on availability alone is chosen here by the
  # absence rather than by a monkeypatch. The tests that hold both
  # implementations and compare them are marked `bindings` and skip
  # themselves; everything else runs.
  # `--group harness` and not `--group test`: `test` includes `bindings`,
  # and uv's `--no-group` suppresses a group that was selected, not one
  # another group includes.
  # `--cov-fail-under=0` and not `--no-cov`: the delegated arms are
  # unreachable here by construction, so this run alone cannot meet the
  # floor, and its data is what `coverage-union` gates instead
  no-bindings:
    name: Run the suite with no bindings installed
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.15"
      # asked of the interpreter before the suite, not of the resolver: a
      # job that silently kept the bindings would pass every test below
      # while checking nothing it exists to check
      - name: Assert the bindings are absent
        run: >
          uv run --locked --no-default-groups --group harness
          python -c "from ecc._libsecp256k1 import INSTALLED;
          assert not INSTALLED, 'btclib_secp256k1 is installed';
          from ecc.curves import is_libsecp256k1_serving;
          assert not is_libsecp256k1_serving()"
      - name: Run pytest
        run: >
          uv run --locked --no-default-groups --group harness
          pytest --cov-fail-under=0
        env:
          COVERAGE_FILE: coverage-data-no-bindings
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-no-bindings
          path: coverage-data-no-bindings
          if-no-files-found: error

  # the union of the two runs above, gated at the same floor, beside the
  # `coverage` job's own gate rather than instead of it. A line only the
  # no-bindings run reaches is a line the configuration an ordinary
  # `pip install ecc[secp256k1]` gets never executes, and the
  # `coverage` job reports it by going red; gating the union alone would
  # let it pass. What this gate adds is the line neither run reaches: dead
  # code in either configuration, or a `bindings` marker drawn wider
  # than it should be
  coverage-union:
    name: Combine coverage from both runs, gated at 100% too
    # the job's own `if` replaces the implicit "needs succeeded" check, so
    # the code condition is repeated: without it a prose-only pull request
    # would reach the downloads below with nothing uploaded
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: [changes, coverage, no-bindings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the source files the report reads: a data file names lines by path
      # and number, not by content
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.15"
      - name: Download coverage data from the coverage job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data-bindings
      - name: Download coverage data from the no-bindings job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data-no-bindings
      # `--rcfile=pyproject.toml` names the file and not the floor, so the
      # floor stays `[tool.coverage.report]`'s `fail_under` alone. Typed
      # from a directory without that file, the flag fails the command
      # where its absence would report at no floor at all
      # (btclib-org/.github#443)
      - name: Combine the two runs
        run: >
          uv run --locked --no-default-groups --group harness
          coverage combine --rcfile=pyproject.toml coverage-data-bindings coverage-data-no-bindings
      - name: Report the union, gated at 100%
        run: >
          uv run --locked --no-default-groups --group harness
          coverage report --rcfile=pyproject.toml

  # the bindings without gmpy2, so that the tests comparing the Python
  # arithmetic with the bindings compare its int arithmetic too: the
  # `coverage` job's `test` group carries gmpy2, and there that arithmetic
  # computes in mpz. `--no-cov`: `coverage` and `coverage-union` measure
  # the floor, and this job is here for its comparisons
  int-arithmetic:
    name: Run the suite with the bindings and without gmpy2
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.15"
      # asked of the interpreter before the suite, as `no-bindings` asks:
      # a job that silently kept gmpy2 would compare mpz again
      - name: Assert the bindings serve and the arithmetic is int
        run: >
          uv run --locked --no-default-groups --group harness --group bindings
          python -c "from ecc.curves import is_libsecp256k1_serving, secp256k1;
          assert is_libsecp256k1_serving();
          assert type(secp256k1._modulus) is int, 'gmpy2 is installed'"
      - name: Run pytest
        run: >
          uv run --locked --no-default-groups --group harness --group bindings
          pytest --no-cov

  # the packaging metadata is checked on every pull request, not only on
  # the tag that ships it: a release is the one place where finding a
  # problem is too late, a version being consumed by the upload that
  # carries it. A pull request builds its own files here; a release checks
  # the ones reusable-build.yml built, signed and uploaded, which is what
  # release.yml's publish jobs download
  dist:
    name: Check the distribution files, install one
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # the files the checks below read, from the signed build
      - name: Download the distribution files
        if: inputs.use-signed-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # the same check as the publish jobs make in release.yml: the files
      # the checks below read are the ones the build job printed the
      # digests of, and so the ones published
      - name: Check the files are the ones the build job built
        if: inputs.use-signed-dist
        env:
          DIGESTS: ${{ inputs.digests }}
        shell: bash
        run: |
          sha256sum dist/* | LC_ALL=C sort -k2 \
            | diff - <(printf '%s\n' "$DIGESTS" | grep -F '  dist/')
      # what the sdist normalizer below reads, and what it writes into
      # every member of the archive: uv_build stamps `0` there and ignores
      # this variable, so the export is what puts the commit's own second
      # into the sdist. The bill of materials reads it too, as the
      # document's own timestamp
      - name: Pin the build timestamp to the commit
        if: ${{ !inputs.use-signed-dist }}
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # uv build builds the sdist first and then the wheel from it, so what
      # is checked below is what a user installing from source would get.
      # That the sdist is complete is check-sdist's job, a pre-commit hook
      - name: Build the distribution files
        if: ${{ !inputs.use-signed-dist }}
        run: uv build
      # the member metadata of the sdist, rewritten to the epoch above so
      # that a rebuild of this commit answers with these bytes.
      # --no-project, so this runs on the interpreter uv already fetched
      # and installs nothing into the tree it is about to check
      - name: Rewrite the sdist's member metadata
        if: ${{ !inputs.use-signed-dist }}
        run: |
          uv run --no-project --python 3.15 \
            .github/scripts/normalize_sdist.py dist/
          sha256sum dist/*
      # the script that writes the bill of materials is btclib-org/.github's,
      # served from `main`. It goes under a `path:` and after the build, so
      # it is not among the files `uv build` packed
      - name: Check out the script that writes the bill of materials
        if: ${{ !inputs.use-signed-dist }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: btclib-org/.github
          ref: main
          path: btclib-org-github
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Write the bill of materials
        if: ${{ !inputs.use-signed-dist }}
        run: |
          uv run --no-project --python 3.15 \
            btclib-org-github/.github/scripts/generate_sbom.py dist/ sbom/
      # this upload does not freeze `dist`: a later step can upload an
      # artifact of the same name over it. A release does not publish
      # this upload: its publish jobs check the files they download
      # against the digests of release.yml's build job
      - name: Upload the distribution files
        if: ${{ !inputs.use-signed-dist }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - name: Upload the bill of materials
        if: ${{ !inputs.use-signed-dist }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
      # the same validation PyPI applies on upload: broken metadata, or a
      # README that does not render, cannot be fixed by reuploading
      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*
      # where the files land once installed, diffed against the package
      # tree [tool.check-wheel-contents] names, in both directions
      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl
      # metadata that is valid but poor, which twine cannot see; the pyroma
      # hook rates the source tree, this the sdist that would ship
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
      # install the wheel from an empty directory, so the import finds the
      # wheel and not the source tree, once bare and once with each extra,
      # and sign and verify once in each. The bare install answers on the
      # Python arithmetic over int, the `secp256k1` extra on the bindings
      # and the `gmpy2` extra on the Python arithmetic over mpz, so each
      # asserts which one served rather than trusting that the install
      # chose it. The dependencies resolve from the index, which is what a
      # user installing this wheel gets
      - name: Smoke-test the wheel, bare and with each extra
        run: |
          cd "$RUNNER_TEMP"
          set -- "$GITHUB_WORKSPACE"/dist/*.whl
          for extra in "" "[secp256k1]" "[gmpy2]"; do
            rm -rf .venv
            uv venv
            uv pip install "$1$extra"
            .venv/bin/python -c "
          import sys
          from importlib.metadata import requires, version
          import ecc
          from ecc.curves import is_libsecp256k1_serving, mult, secp256k1
          from ecc.ecc import dsa

          print(version(ecc.name), requires(ecc.name))
          assert ecc.__version__ == version(ecc.name)
          assert is_libsecp256k1_serving() is (sys.argv[1] == '[secp256k1]')
          field = 'mpz' if sys.argv[1] == '[gmpy2]' else 'int'
          assert type(secp256k1._modulus).__name__ == field
          sig = dsa.sign(b'ecc', 1)
          assert dsa.verify(b'ecc', mult(1), sig)
          " "$extra"
          done
      # the suite as the sdist ships it, unpacked outside the checkout and
      # gated at 100% on the interpreter the coverage job pins. A shipped
      # test reading a file the archive leaves out fails here, and so does
      # a helper whose only caller source-exclude takes out, its lines left
      # unreached. tests/source_exclude_test.py sees only a test that names
      # .github. --locked holds the run to the uv.lock the sdist
      # carries
      - name: Run the suite from the unpacked sdist
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          uv run --locked --python 3.15 --no-default-groups --group test pytest

  # the single check main's branch protection requires from this workflow.
  # The rule names its checks as literal strings stored outside the
  # repository, so it names this job, which never changes, and this job
  # depends on the others: adding a job here is enough to gate on it
  test-passed:
    # the name is what branch protection matches, and it carries the
    # workflow because a check context is keyed by name alone
    name: "test: every job passed"
    needs:
      - changes
      - coverage
      - no-bindings
      - int-arithmetic
      - coverage-union
      - dist
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check satisfies the rule, so the gate has to run to be able
    # to fail. Not always(): a cancellation of this run by its concurrency
    # group would then fail it.
    # The draft flag is not part of this condition: a skipped required
    # check reads as passing, and this job's own check run does not exist
    # until every job above has settled, so declining it here while draft
    # would leave the draft's skip as the only check of this name on the
    # sha until a later run's own aggregate exists. The closed condition
    # stays, carried by every job above too: a closed pull request has
    # nothing left to become ready (btclib-org/.github#1327)
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the whole needs context rather than each job by name, so a job
      # added to needs is covered without touching this. "skipped" passes:
      # a prose-only pull request skips every job but `changes` by design.
      # In the shell rather than in a boolean `contains(needs.*.result,
      # ...)` expression, which is skipped when false and leaves the job
      # green over a failed matrix (btclib-org/btclib#1001). The `case`
      # refuses an empty field and an empty join, which the loop's word
      # splitting would drop (btclib-org/btclib#1454), and the allowlist
      # fails a result this file does not anticipate. The interpolated
      # join is a closed set GitHub writes, so no fork-controlled string
      # reaches this shell
      #
      # a skipped required check reads as passing, so the draft flag
      # moves from the job's own `if:` above into this first step: the
      # job still runs while draft, and reports a failure instead of a
      # skip (btclib-org/.github#1327)
      - name: Fail while this pull request is a draft
        if: github.event.pull_request.draft
        run: |
          echo "::error::this pull request is a draft"
          exit 1
      - name: Fail unless every job above succeeded or was legitimately skipped
        run: | # zizmor: ignore[template-injection]
          results='${{ join(needs.*.result, ',') }}'
          echo "results: $results"
          case ",$results," in
            *,,*)
              echo "::error::a job this gate depends on reported no result"
              exit 1
              ;;
          esac
          IFS=,
          for result in $results; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a job this gate depends on reported $result"
                exit 1
                ;;
            esac
          done
